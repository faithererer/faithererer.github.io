  title: '追剧列表'
  quote: '生命不息，追剧不止！'
  show: 1
  lazyload: true
  loading:
  metaColor:
  color:
  webp:
  progress:
  extraOrder:
  extra_options:
    key: value


markdown:
    plugins:
      - '@renbaoshuo/markdown-it-katex'

kramed:
  gfm: true
  pedantic: false
  sanitize: false
  tables: true
  breaks: true
  smartLists: true
  smartypants: true



# 图片懒加载
lazyload:
  enable: true
  loadingImg: /img/loading.gif



